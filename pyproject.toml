[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desalination-llm"
version = "0.1.0"
description = "LLM-guided graphene nanopore design and paper reproducibility tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Omid Barati Farimani"},
  {name = "Amir Barati Farimani"}
]
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.8,<1.9",
  "scipy>=1.10"
]

[project.optional-dependencies]
torch = ["torch>=2.1", "torchvision>=0.16"]
agents = ["openai>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
desalination-llm = "desalination_llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
