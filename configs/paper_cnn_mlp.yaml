structure: data/structures/pristine_graphene_4040.pdb
output_dir: results/paper_cnn_mlp
runs: 5

optimization:
  steps: 30
  trials_per_step: 20
  nearest_neighbors: 30
  max_atoms_per_trial: 3
  max_atoms_per_step: 3
  max_total_removals: 90
  minimum_rejection: 0.60
  random_seed: 42
  edge_margin_angstrom: 2.5
  colonize_internal_atoms: true
  require_flux_improvement: false
  save_trial_assets: true

predictor:
  backend: cnn-mlp
  model_dir: models/original_cnn_mlp
  labels_csv: models/original_cnn_mlp/noisy_train.csv
  device: auto

agents:
  mode: rule-based
  minimum_votes: 2
